version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: switchboard
    main: ./cmd/switchboard
    binary: switchboard
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/Grace/switchboard/internal/cli.Version={{.Version}}
      - -X github.com/Grace/switchboard/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/Grace/switchboard/internal/cli.Date={{.CommitDate}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# An SBOM answers "what is in this binary" without the reviewer having to take
# our word for it, and it is the first thing a supply-chain question asks for.
sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.spdx.json"

# Keyless signing: the certificate is issued to the GitHub Actions identity that
# built the release and recorded in the public transparency log, so a signature
# proves which workflow, at which commit, produced the artifact. There is no
# private key to hold, and therefore none to leak or rotate.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  footer: |
    ## Install

    ```sh
    # macOS / Linux — download, verify, run
    tar xzf switchboard_{{ .Version }}_$(uname -s | tr A-Z a-z)_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz
    ./switchboard serve
    ```
