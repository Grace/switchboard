name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # -coverpkg matters here. Per-package coverage attributes a helper only to
      # tests in its own package, so a type exercised entirely by another
      # package's tests reports 0.0% and looks untested when it is not.
      # Compliance profiles that require FIPS 140-3 refuse to validate outside
      # it, so their tests need the Go Cryptographic Module enabled. This tests
      # the mode those profiles are meant to run in; it does not exercise the
      # non-FIPS path, which is a gap worth knowing about.
      - name: test
        env:
          GODEBUG: fips140=on
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...

      - name: coverage
        run: |
          go tool cover -func=coverage.out | tail -1
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | grep -vE "\s100\.0%$" | tail -25 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - run: go build ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t switchboard:ci .
      - name: it starts
        run: docker run --rm switchboard:ci --help
