name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
      # Every step below carries `if: !cancelled()` so that one failure reports
      # the others rather than hiding them. gofmt is first and fails the job
      # instantly, and for eight commits that meant vet, the tests, both builds
      # and govulncheck never ran on main at all: a whitespace nit bought total
      # blindness to every check that could have found something real. Not
      # `always()`, which would keep going after a cancellation too.
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
        if: ${{ !cancelled() }}
      - run: go test -race -coverprofile=coverage.out ./...
        if: ${{ !cancelled() }}
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath ./cmd/gateway
        if: ${{ !cancelled() }}
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath ./cmd/gateway
        if: ${{ !cancelled() }}
      # Scans the module graph against the Go vulnerability database. Marketplace
      # requires sellers to keep software free of known vulnerabilities.
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
        if: ${{ !cancelled() }}
      - run: govulncheck ./...
        if: ${{ !cancelled() }}
  control:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: switchboard_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/switchboard_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - run: pip install -r controlplane/requirements-dev.txt
      - run: python -m pytest controlplane/tests -v
      - run: pip install pip-audit
      - run: pip-audit -r controlplane/requirements.txt
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -f Dockerfile.gateway -t switchboard-gateway:ci .
      - run: docker build -f Dockerfile.controlplane -t switchboard-control:ci .
  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - run: pip install 'cfn-lint>=1,<2'
      - run: cfn-lint deploy/cloudformation/*.yaml
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      # -check, because plain `terraform fmt` rewrites the runner's checkout and
      # exits 0 whatever it finds. Without it this step could never fail.
      - run: terraform -chdir=deploy/terraform fmt -check -recursive
      - run: terraform -chdir=deploy/terraform init -backend=false
      - run: terraform -chdir=deploy/terraform validate
      - run: terraform -chdir=deploy/terraform/controlplane init -backend=false
      - run: terraform -chdir=deploy/terraform/controlplane validate
      - run: terraform -chdir=deploy/terraform/postgres init -backend=false
      - run: terraform -chdir=deploy/terraform/postgres validate
  # Every commit in a pull request must carry a Signed-off-by trailer certifying
  # the DCO. Hand-rolled rather than a marketplace action: it is a dozen lines,
  # and a repository whose argument is a minimal trusted dependency graph should
  # not pull a third party into CI to read a git trailer.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          # --no-merges: a merge commit carries no sign-off trailer and cannot be
          # given one without rewriting the merge, so flagging it would produce a
          # failure with no remedy the printed advice can fix.
          for sha in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            if ! git log -1 --format=%B "$sha" | git interpret-trailers --parse | grep -qi '^Signed-off-by:'; then
              echo "::error::missing Signed-off-by: $sha $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with 'git commit -s'. To fix the most recent commit:"
            echo "  git commit -s --amend --no-edit && git push --force-with-lease"
            echo "For several, rebase and sign off each. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits signed off."

  # The first-run path, exercised from clean. Nothing checked it before, so the
  # one route a newcomer takes was the least protected thing in the repository --
  # and it can only rot silently, because whoever would notice already has warm
  # images and a populated .dev/env, which are the two things a newcomer does not.
  #
  # `containers` above proves both images build. This proves they run, find each
  # other in the shared namespace, apply migrations, provision a tenant, sign a
  # policy, and serve a completion through it.
  devstack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Bring the local stack up
        run: make dev-up
      - name: Prove a request traverses the whole path
        run: make dev-smoke
      # The failure this job exists to catch is one that leaves nothing on
      # stdout, so the logs are the finding rather than a convenience.
      - name: Container logs on failure
        if: ${{ failure() }}
        run: docker compose -f docker-compose.dev.yml logs --no-color --tail=200
      - name: Tear down
        if: ${{ always() }}
        run: make dev-down
