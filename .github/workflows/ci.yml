name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # -coverpkg matters here. Per-package coverage attributes a helper only to
      # tests in its own package, so a type exercised entirely by another
      # package's tests reports 0.0% and looks untested when it is not.
      - name: test
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...

      # Profiles requiring FIPS 140-3 skip when the Go Cryptographic Module is
      # not enabled, so the run above covers the ordinary path and this one
      # reaches the branch it skips. Running the whole suite under FIPS instead
      # would cover that branch and lose the other.
      - name: test under FIPS
        env:
          GODEBUG: fips140=on
        run: go test -race -count=1 ./internal/config/

      - name: coverage
        run: |
          go tool cover -func=coverage.out | tail -1
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | grep -vE "\s100\.0%$" | tail -25 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - run: go build ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t switchboard:ci .
      - name: it starts
        run: docker run --rm switchboard:ci --help
